name: Bug report
description: Report a defect in QENIVO
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not paste proprietary MPS models.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected vs actual behaviour, exit code, engine name.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Command line, tiny model, or unit-test sketch.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: qenivo version / commit
      placeholder: output of `qenivo info`
    validations:
      required: true
  - type: checkboxes
    id: sovereignty
    attributes:
      label: Checks
      options:
        - label: I did not introduce a foreign solver into the solve path
          required: true
